services:
  - type: web
    name: solarwise-sa-vinny-preview
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run db:generate
    # Free previews apply checked-in migrations before startup; paid deployments should use preDeployCommand.
    startCommand: npm run db:deploy && npm run db:seed:if-configured && npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solarwise-preview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: abutvincent23@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://solarwise-sa-vinny-preview.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://solarwise-sa-vinny-preview.onrender.com
      - key: OPEN_METEO_CACHE_TTL_MS
        value: "3600000"

databases:
  - name: solarwise-preview-db
    region: frankfurt
    plan: free
    databaseName: solarwise
    user: solarwise
